<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Gabriel Paludeto — Ad astra per aspera">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0D1528" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.45" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="55%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#C7D2FE" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.0" />
      <stop offset="20%" stop-color="#38BDF8" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="1.0" />
      <stop offset="80%" stop-color="#34D399" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.0" />
    </linearGradient>

    <radialGradient id="nebula1" cx="22%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebula2" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.10" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="218" rx="16" />
    </clipPath>
  </defs>

  <style>
    .twinkle-a { animation: twinkle 3.6s ease-in-out infinite; }
    .twinkle-b { animation: twinkle 4.8s ease-in-out 1.1s infinite; }
    .twinkle-c { animation: twinkle 2.9s ease-in-out 0.6s infinite; }
    .pulse-wave {
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawWave 4.5s ease-in-out infinite;
    }
    .dot-blink { animation: blink 1.8s step-end infinite; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.95; }
    }
    @keyframes drawWave {
      0% { stroke-dashoffset: 1200; opacity: 0.35; }
      45% { stroke-dashoffset: 0; opacity: 1; }
      75% { stroke-dashoffset: 0; opacity: 0.9; }
      100% { stroke-dashoffset: -1200; opacity: 0.25; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
  </style>

  <!-- Card background -->
  <g clip-path="url(#cardClip)">
    <rect width="900" height="220" fill="url(#bg)" />
    <rect width="900" height="220" fill="url(#grid)" />
    <rect width="900" height="220" fill="url(#nebula1)" />
    <rect width="900" height="220" fill="url(#nebula2)" />

    <!-- Starfield -->
    <g fill="#E2E8F0">
      <circle class="twinkle-a" cx="68" cy="40" r="1.4" />
      <circle class="twinkle-b" cx="132" cy="72" r="1.0" />
      <circle class="twinkle-c" cx="195" cy="32" r="1.6" fill="#38BDF8" />
      <circle class="twinkle-a" cx="278" cy="56" r="1.0" />
      <circle class="twinkle-b" cx="635" cy="46" r="1.2" />
      <circle class="twinkle-c" cx="718" cy="34" r="1.7" fill="#818CF8" />
      <circle class="twinkle-a" cx="788" cy="64" r="1.1" />
      <circle class="twinkle-b" cx="842" cy="42" r="1.5" fill="#34D399" />
      <circle class="twinkle-c" cx="94" cy="136" r="1.1" />
      <circle class="twinkle-a" cx="814" cy="128" r="1.2" />
      <circle class="twinkle-b" cx="748" cy="102" r="0.9" />
      <circle class="twinkle-c" cx="152" cy="112" r="1.0" />
    </g>

    <!-- Subtle oscilloscope baseline + static wavelet/ECG trace -->
    <line x1="40" y1="180" x2="860" y2="180" stroke="#334155" stroke-width="0.8" stroke-dasharray="4 6" />
    <path
      d="M 40 180 L 155 180 C 175 180, 184 172, 195 172 C 206 172, 214 180, 232 180
         L 286 180 C 296 180, 300 188, 308 188 C 316 188, 322 152, 330 144
         C 338 136, 344 206, 352 202 C 360 198, 368 164, 378 170 C 388 176, 396 180, 412 180
         L 468 180 C 482 180, 490 166, 500 166 C 510 166, 518 194, 528 194
         C 538 194, 546 150, 556 150 C 566 150, 574 200, 584 200
         C 594 200, 602 168, 612 170 C 622 172, 630 180, 650 180
         L 720 180 C 736 180, 744 170, 756 170 C 768 170, 776 180, 792 180 L 860 180"
      fill="none" stroke="#38BDF8" stroke-width="1.4" stroke-opacity="0.20" />

    <!-- Animated glowing signal sweep -->
    <path
      class="pulse-wave"
      filter="url(#glow)"
      d="M 40 180 L 155 180 C 175 180, 184 172, 195 172 C 206 172, 214 180, 232 180
         L 286 180 C 296 180, 300 188, 308 188 C 316 188, 322 152, 330 144
         C 338 136, 344 206, 352 202 C 360 198, 368 164, 378 170 C 388 176, 396 180, 412 180
         L 468 180 C 482 180, 490 166, 500 166 C 510 166, 518 194, 528 194
         C 538 194, 546 150, 556 150 C 566 150, 574 200, 584 200
         C 594 200, 602 168, 612 170 C 622 172, 630 180, 650 180
         L 720 180 C 736 180, 744 170, 756 170 C 768 170, 776 180, 792 180 L 860 180"
      fill="none" stroke="url(#waveGrad)" stroke-width="2.4" stroke-linecap="round" />

    <!-- Top telemetry label -->
    <g font-family="'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2.0">
      <circle class="dot-blink" cx="252" cy="40" r="3.5" fill="#34D399" />
      <text x="462" y="44" text-anchor="middle" fill="#7DD3FC" opacity="0.92">UTFPR · COMPUTER ENGINEERING · @PALUDETO</text>
    </g>

    <!-- Main name -->
    <text x="450" y="102" text-anchor="middle"
          font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
          font-size="44" font-weight="800" letter-spacing="3" fill="url(#titleGrad)">
      GABRIEL PALUDETO
    </text>

    <!-- Motto -->
    <text x="450" y="136" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="17" font-style="italic" letter-spacing="1.6" fill="#CBD5E1">
      ✦  Ad astra per aspera.  ✦
    </text>
  </g>

  <!-- Crisp border -->
  <rect x="1" y="1" width="898" height="218" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />
</svg>
