<svg xmlns="http://www.w3.org/2000/svg" width="900" height="92" viewBox="0 0 900 92" role="img" aria-label="Ad astra per aspera">
  <defs>
    <linearGradient id="fbg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0D1528" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>
    <linearGradient id="fborder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="fwave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="fwave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.08" />
    </linearGradient>
    <clipPath id="fclip">
      <rect x="1" y="1" width="898" height="90" rx="14" />
    </clipPath>
  </defs>

  <style>
    .drift1 { animation: shift1 9s ease-in-out infinite alternate; }
    .drift2 { animation: shift2 12s ease-in-out infinite alternate; }
    @keyframes shift1 {
      0% { transform: translateX(-24px); }
      100% { transform: translateX(24px); }
    }
    @keyframes shift2 {
      0% { transform: translateX(20px); }
      100% { transform: translateX(-20px); }
    }
  </style>

  <g clip-path="url(#fclip)">
    <rect width="900" height="92" fill="url(#fbg)" />
    <path class="drift1" d="M -40 58 Q 110 22, 260 58 T 560 58 T 860 58 T 1000 58 L 1000 96 L -40 96 Z" fill="url(#fwave1)" />
    <path class="drift2" d="M -40 66 Q 130 34, 300 66 T 640 66 T 980 66 L 980 96 L -40 96 Z" fill="url(#fwave2)" />

    <circle cx="110" cy="24" r="1.2" fill="#38BDF8" opacity="0.65" />
    <circle cx="240" cy="18" r="1.0" fill="#E2E8F0" opacity="0.45" />
    <circle cx="670" cy="20" r="1.1" fill="#818CF8" opacity="0.65" />
    <circle cx="790" cy="26" r="1.3" fill="#34D399" opacity="0.6" />

    <text x="450" y="49" text-anchor="middle"
          font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" letter-spacing="2.8" fill="#CBD5E1">
      ✦  AD ASTRA PER ASPERA  ✦
    </text>
  </g>

  <rect x="1" y="1" width="898" height="90" rx="14" fill="none" stroke="url(#fborder)" stroke-width="1.2" />
</svg>
